<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DFI.codes Title Art</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at top,#2d2d2d 0%,#111 45%,#050505 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

.dfi-title{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;

  font-size:clamp(42px,8vw,120px);
  font-weight:900;
  letter-spacing:-0.06em;
  line-height:1;

  color:#f6f2eb;

  white-space:nowrap;

  text-shadow:
    0 0 8px rgba(255,255,255,.12),
    0 0 24px rgba(255,255,255,.08),
    0 0 60px rgba(160,120,255,.12);

  transform:
    skewX(-8deg)
    rotate(-2deg);
}

.title::before{
  content:"";
  position:absolute;
  inset:-22px -34px;
  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.06),
      rgba(120,90,255,.04)
    );

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);

  z-index:-1;

  box-shadow:
    0 0 40px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.08);
}

.title span{
  display:inline-block;
}

.bracket{
  color:#7df7c5;
}

.arrow{
  color:#7dc7ff;
}

.domain{
  color:#fff7d1;
}

.colon{
  color:#ff9ccf;
}

.dot{
  color:#ffdf70;
}

.glow{
  position:absolute;
  width:160%;
  height:180%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:
    radial-gradient(circle,
      rgba(120,90,255,.18) 0%,
      rgba(120,90,255,0) 70%);
  z-index:-2;
  filter:blur(50px);
}
</style>
</head>
<body>
<div class="dfi-title">
  <div class="glow"></div>

  <span class="bracket">{</span>
  <span class="arrow">&lt;</span>
  <span class="colon">:</span>
  <span class="domain">DFI</span>
  <span class="dot">.</span>
  <span class="domain">codes</span>
  <span class="colon">:</span>
  <span class="arrow">&gt;</span>
  <span class="bracket">}</span>
</div>
</body>
</html>
